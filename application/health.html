<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Check - Scalable Web Application</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px;
            background: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .status {
            text-align: center;
            margin-bottom: 30px;
        }
        .status-icon {
            font-size: 80px;
            color: #4CAF50;
            margin-bottom: 20px;
        }
        .status h1 {
            color: #4CAF50;
            margin: 0;
            font-size: 2em;
        }
        .info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
        }
        .info h2 {
            margin-top: 0;
            color: #333;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .info-item:last-child {
            border-bottom: none;
        }
        .info-label {
            font-weight: bold;
            color: #666;
        }
        .info-value {
            color: #333;
        }
        .timestamp {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status">
            <div class="status-icon">&#10004;</div>
            <h1>Status: Healthy</h1>
        </div>
        
        <div class="info">
            <h2>Instance Information</h2>
            <div class="info-item">
                <span class="info-label">Instance ID:</span>
                <span class="info-value" id="instance-id">Loading...</span>
            </div>
            <div class="info-item">
                <span class="info-label">Availability Zone:</span>
                <span class="info-value" id="az">Loading...</span>
            </div>
            <div class="info-item">
                <span class="info-label">Private IP:</span>
                <span class="info-value" id="private-ip">Loading...</span>
            </div>
            <div class="info-item">
                <span class="info-label">Hostname:</span>
                <span class="info-value" id="hostname">Loading...</span>
            </div>
            <div class="info-item">
                <span class="info-label">Timestamp:</span>
                <span class="info-value" id="timestamp">Loading...</span>
            </div>
        </div>
        
        <p class="timestamp">Last checked: <span id="last-checked"></span></p>
    </div>
    
    <script>
        async function fetchHealthInfo() {
            try {
                const tokenResponse = await fetch('http://169.254.169.254/latest/api/token', {
                    method: 'PUT',
                    headers: { 'X-aws-ec2-metadata-token-ttl-seconds': '21600' }
                });
                const token = await tokenResponse.text();
                
                const headers = { 'X-aws-ec2-metadata-token': token };
                
                const [instanceId, az, privateIp, hostname] = await Promise.all([
                    fetch('http://169.254.169.254/latest/meta-data/instance-id', { headers }).then(r => r.text()),
                    fetch('http://169.254.169.254/latest/meta-data/placement/availability-zone', { headers }).then(r => r.text()),
                    fetch('http://169.254.169.254/latest/meta-data/local-ipv4', { headers }).then(r => r.text()),
                    fetch('http://169.254.169.254/latest/meta-data/local-hostname', { headers }).then(r => r.text())
                ]);
                
                document.getElementById('instance-id').textContent = instanceId;
                document.getElementById('az').textContent = az;
                document.getElementById('private-ip').textContent = privateIp;
                document.getElementById('hostname').textContent = hostname;
                
                const now = new Date();
                document.getElementById('timestamp').textContent = now.toISOString();
                document.getElementById('last-checked').textContent = now.toLocaleString();
            } catch (error) {
                console.error('Error fetching health info:', error);
                document.getElementById('instance-id').textContent = 'N/A';
                document.getElementById('az').textContent = 'N/A';
                document.getElementById('private-ip').textContent = 'N/A';
                document.getElementById('hostname').textContent = 'N/A';
            }
        }
        
        fetchHealthInfo();
        
        // Auto-refresh every 30 seconds
        setInterval(fetchHealthInfo, 30000);
    </script>
</body>
</html>
